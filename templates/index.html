<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AV資料管理系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    
    
    <!-- 現代化視頻播放器系統 -->
    <link rel="stylesheet" href="/tmp_rovodev_modern_video_player.css">
    <script src="/tmp_rovodev_modern_video_player.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
            color: #fff;
            min-height: 100vh;
        }

        /* 第一欄：掃描區 */
        .scan-section {
            background: rgba(0, 0, 0, 0.9);
            padding: 0.75rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #dc143c;
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 80px;
            min-height: 80px;
            max-height: 80px;
        }
        
        /* 左側區域：僅LOGO */
        .left-section {
            flex-shrink: 0;
        }
        
        .control-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        
        /* 中間區域：狀態框 */
        .middle-section {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            width: 250px;
            flex-shrink: 0;
            margin-left: -1rem;
            margin-right: -2.9rem;
        }
        
        /* 右側區域：最愛 + 搜索水平排列 */
        .right-section {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-shrink: 0;
        }
        
        /* 路徑框在按鈕區域中的樣式 */
        .control-buttons .directory-input-container {
            display: flex;
            align-items: center;
        }
        
        .control-buttons .directory-input {
            width: 180px;
        }
        
        /* 我的最愛按鈕與載入預設一樣寬 */
        .favorites-btn {
            width: 120px;
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid #666 !important;
        }
        
        .favorites-btn:hover {
            background: rgba(255, 255, 255, 0.2) !important;
            transform: scale(1.05) !important;
        }
        
        .favorites-btn.active {
            background: #dc143c !important;
            border-color: #dc143c !important;
            box-shadow: 0 0 15px rgba(220, 20, 60, 0.5) !important;
        }
        
        /* 統一寬度設定 - 再縮短 */
        .middle-section .progress-bar,
        .control-buttons .directory-input,
        .right-section .search-input {
            width: 180px;
        }
        
        /* 按鈕縮小 */
        .btn {
            padding: 0.4rem 0.8rem !important;
            font-size: 0.85rem !important;
            min-width: auto !important;
        }
        
        .btn i {
            margin-right: 0.3rem !important;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #dc143c;
        }

        .scan-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            background: linear-gradient(45deg, #dc143c, #ff6b6b);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(220, 20, 60, 0.3);
        }

        .btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #333, #555);
        }

        .btn-stop {
            background: linear-gradient(45deg, #cc0000, #ff3333);
            display: none;
        }

        .progress-container {
            flex: 1;
            max-width: 600px;
            margin: 0 1rem;
            min-width: 300px;
        }

        .directory-input {
            width: 280px;
            height: 36px;
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 13px;
            font-weight: 500;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        .directory-input::placeholder {
            color: #888;
        }
        
        .directory-input:focus {
            outline: none;
            border-color: #dc143c;
            box-shadow: 0 0 5px rgba(220, 20, 60, 0.3);
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0;
        }

        .status-text {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 8px 12px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
            text-align: left;
            width: 220px;
            height: 36px;
            line-height: 36px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            transition: all 0.3s ease;
            overflow: hidden;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .status-text.scanning {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            animation: pulse 2s infinite;
        }

        .status-text.complete {
            background: linear-gradient(45deg, #4CAF50, #45a049);
        }

        .status-text.error {
            background: linear-gradient(45deg, #f44336, #d32f2f);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #dc143c, #ff6b6b);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 12px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .progress-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: 0.7rem;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            z-index: 10;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            font-weight: 600;
            padding: 2px 8px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #666;
            border-radius: 15px;
            padding: 0.5rem 2.5rem 0.5rem 1rem;
            color: white;
            min-width: 220px;
            width: 220px;
        }

        .search-input::placeholder {
            color: #999;
        }

        .search-box i {
            position: absolute;
            right: 1rem;
            color: #999;
        }

        /* 第二欄：篩選區 */
        .filter-section {
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem 2rem;
            display: flex;
            gap: 2rem;
            border-bottom: 1px solid #333;
            height: 160px;
            min-height: 160px;
            max-height: 160px;
            overflow: hidden;
        }

        .filter-left {
            width: 50%;
            flex: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .filter-right {
            width: 50%;
            flex: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-label {
            font-weight: bold;
            color: #dc143c;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            max-height: 120px;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 8px 25px 0;
        }
        
        /* 自定義滾動條樣式 */
        .filter-tags::-webkit-scrollbar {
            width: 6px;
        }
        
        .filter-tags::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        
        .filter-tags::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
        
        .filter-tags::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .filter-tag {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #666;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .filter-tag:hover {
            background: rgba(220, 20, 60, 0.2);
            border-color: #dc143c;
        }

        .filter-tag.active {
            background: #dc143c;
            border-color: #dc143c;
            color: white;
        }
        
        .clear-filters-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 4px 8px;
            margin-left: 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .clear-filters-btn:hover {
            background: #d32f2f;
            transform: scale(1.05);
        }
        
        .clear-filters-btn i {
            font-size: 10px;
        }

        /* 第三欄：卡片區 */
        .content-section {
            padding: 2rem;
            flex: 1;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1.5rem;
            justify-content: center;
            justify-items: center;
            max-width: 1600px;
            margin: 0 auto;
        }

        .card {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid #333;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            height: 420px;
            width: 100%;
            max-width: 280px;
            min-width: 250px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(220, 20, 60, 0.3);
            border-color: #dc143c;
        }

        .card-image {
            position: relative;
            width: 100%;
            height: 200px;
            background: #333;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            min-height: 200px;
            max-height: 200px;
            border: none;
            outline: none;
        }
        
        /* 圖片載入優化樣式 */
        .lazy-load {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .lazy-load.loaded {
            opacity: 1;
        }
        
        .image-loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        
        .loading-spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #dc143c;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover .card-overlay {
            opacity: 1;
        }

        .play-button {
            background: #dc143c;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .card-content {
            padding: 0.8rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            font-size: 0.8rem;
        }

        .card-code {
            color: #dc143c;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #fff;
            font-size: 0.85rem;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-detail {
            color: #ccc;
            font-size: 0.75rem;
            margin-bottom: 0.3rem;
            line-height: 1.2;
        }

        .card-description {
            color: #999;
            font-size: 0.7rem;
            margin-bottom: 0.5rem;
            line-height: 1.3;
            flex: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .card-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #999;
            margin-top: auto;
        }
        

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            display: none;
        }

        .empty-icon {
            font-size: 4rem;
            color: #666;
            margin-bottom: 1rem;
        }

        .empty-message {
            font-size: 1.2rem;
            color: #999;
            margin-bottom: 0.5rem;
        }

        .empty-hint {
            color: #666;
        }

        /* 響應式設計 */
        /* 手機版 */
        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.8rem;
                max-width: 500px;
            }
            
            .card {
                max-width: none;
                min-width: 160px;
                height: 350px;
            }
        }
        
        /* 平板版 */
        @media (max-width: 768px) {
            .scan-section {
                flex-direction: column;
                gap: 1rem;
            }

            .scan-controls {
                width: 100%;
                justify-content: space-between;
            }

            .filter-section {
                flex-direction: column;
                gap: 1rem;
            }

            .filter-left, .filter-right {
                flex: none;
            }

            .search-input {
                min-width: 200px;
            }

            .gallery {
                grid-template-columns: repeat(3, 1fr);
                gap: 1rem;
                max-width: 1000px;
            }

            .card {
                height: 380px;
            }
        }

        /* 視頻播放器樣式 */
        .video-player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .video-player-container {
            width: 90%;
            max-width: 1200px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }

        .video-header {
            background: #1a1a1a;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .close-btn {
            background: #dc143c;
            border: none;
            color: white;
            padding: 0.5rem;
            border-radius: 5px;
            cursor: pointer;
        }

        video {
            width: 100%;
            height: 70vh;
            outline: none;
            border: none;
        }
        
        video:focus {
            outline: none;
            border: none;
            box-shadow: none;
        }

        
        /* 愛心圖標樣式 */
        .heart-icon {
            font-size: 1.2rem;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            margin-left: 0.5rem;
        }
        
        .heart-icon:hover {
            color: #dc143c;
            transform: scale(1.2);
        }
        
        .heart-icon.favorited {
            color: #dc143c;
        }
        
        /* 垃圾桶圖標樣式 */
        .delete-icon {
            font-size: 1.1rem;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            margin-left: 0.3rem;
        }
        
        .delete-icon:hover {
            color: #ff4444;
            transform: scale(1.2);
        }
        
        /* 資料夾圖標樣式 */
        .folder-icon {
            font-size: 1.1rem;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            margin-right: 0.3rem;
        }
        
        .folder-icon:hover {
            color: #4CAF50;
            transform: scale(1.2);
        }
        
        /* 隱藏文件選擇器 */
        .hidden {
            display: none;
        }
        
        /* 簡化分頁樣式 */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            gap: 10px;
        }
        
        /* 分頁按鈕 */
        .pagination-btn {
            background: #444;
            border: 1px solid #666;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .pagination-btn:hover:not(:disabled) {
            background: #555;
            border-color: #888;
        }
        
        .pagination-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        
        /* 頁碼數字區域 */
        .pagination-numbers {
            display: flex;
            gap: 5px;
            margin: 0 15px;
            align-items: center;
        }
        
        .pagination-number {
            color: #ccc;
            cursor: pointer;
            transition: color 0.3s ease;
            font-size: 1rem;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 4px;
            min-width: 35px;
            text-align: center;
        }
        
        .pagination-number:hover {
            color: white;
        }
        
        .pagination-number.active {
            color: #dc143c;
            font-weight: bold;
            cursor: default;
        }
        
        .pagination-ellipsis {
            color: #888;
            padding: 8px 12px;
            background: transparent;
            border: none;
            cursor: default;
        }
        
        /* 響應式設計 */
        @media (max-width: 768px) {
            .pagination-container {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            
            .pagination-nav {
                order: 2;
            }
            
            .pagination-size-selector {
                order: 1;
            }
            
            .pagination-jump {
                order: 3;
            }
            
            .pagination-info {
                order: 4;
                text-align: center;
            }
            
            .pagination-numbers {
                gap: 5px;
                margin: 0 5px;
            }
            
            .pagination-number, .pagination-btn {
                padding: 8px 10px;
                min-width: 32px;
                font-size: 0.9em;
            }
        }
        
        /* 資料夾彈出視窗樣式 */
        .folder-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        
        .folder-modal-content {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            width: 80%;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-height: 60vh;
            overflow-y: auto;
        }
        
        .folder-modal h3 {
            margin: 0 0 20px 0;
            color: #4CAF50;
            text-align: center;
        }
        
        .folder-path {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            font-family: monospace;
            word-break: break-all;
            border: 1px solid #444;
        }
        
        .folder-url {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            font-family: monospace;
            word-break: break-all;
            border: 1px solid #444;
            color: #4CAF50;
            cursor: pointer;
        }
        
        .folder-url:hover {
            background: #333;
            border-color: #4CAF50;
        }
        
        .folder-modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        
        .folder-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .folder-btn-open {
            background: #4CAF50;
            color: white;
        }
        
        .folder-btn-open:hover {
            background: #45a049;
        }
        
        .folder-btn-copy {
            background: #2196F3;
            color: white;
        }
        
        .folder-btn-copy:hover {
            background: #1976D2;
        }
        
        .folder-btn-cancel {
            background: #f44336;
            color: white;
        }
        
        .folder-btn-cancel:hover {
            background: #d32f2f;
        }
        
        /* 資料夾內容顯示 */
        .folder-contents {

<body>

        <!-- 🚀 分頁系統容器 - 解決 700+ 部影片性能瓶頸的核心 -->

        <div id="emptyState" class="empty-state">

    <script>
        // WebSocket 連接
        const socket = io();
        
        // 全局變數
        let allData = [];
        let filteredData = [];
        let selectedDirectory = '';
        let isScanning = false;
        let activeFilters = {
            search: '',
            actress: [],
            seriesGenre: [],
            favorites: false
        };
        
        // 分頁變數
        let currentPage = 1;
        let pageSize = 50;
        let totalPages = 1;
        let currentData = []; // 當前顯示的資料（經過篩選的）
        
        // 圖片載入優化變量
        let imageCache = new Map(); // 圖片快取
        let observer; // Intersection Observer
        let imageLoadingQueue = new Set(); // 載入隊列
        let loadedImages = new Set(); // 已載入圖片記錄
        let pageImageCache = new Map(); // 分頁圖片快取 - 保存每頁的HTML
        
        // 我的最愛管理
        let favorites = new Set();
        
        // 從localStorage載入最愛
        function loadFavorites() {
            const saved = localStorage.getItem('avFavorites');
            if (saved) {
                favorites = new Set(JSON.parse(saved));
            }
            updateFavoritesCount();
        }
        
        // 儲存最愛到localStorage
        function saveFavorites() {
            localStorage.setItem('avFavorites', JSON.stringify([...favorites]));
            updateFavoritesCount();
        }
        
        // 更新最愛數量顯示
        function updateFavoritesCount() {
            // 不再顯示數量，保留函數以免其他地方調用出錯
        }
        
        // 切換最愛狀態
        function toggleFavorite(avCode, event) {
            event.stopPropagation(); // 防止觸發卡片點擊
            
            if (favorites.has(avCode)) {
                favorites.delete(avCode);
            } else {
                favorites.add(avCode);
            }
            
            saveFavorites();
            renderGallery(); // 重新渲染以更新愛心圖標
        }

        // 打開影片資料夾 - 顯示資料夾內容
        function openFolder(filePath, event) {
            event.stopPropagation();
            
            const fileUrl = `file://${filePath}/`;
            
            // 創建彈出視窗
            const modal = document.createElement('div');
            modal.className = 'folder-modal';
            modal.innerHTML = `
                <div class="folder-modal-content">
                    <h3>📁 資料夾內容</h3>
                    <div class="folder-contents" id="folder-contents">
                        <div class="folder-loading">正在載入資料夾內容...</div>
                    </div>
                    <div class="folder-modal-buttons">
                        <button class="folder-btn folder-btn-cancel" onclick="closeFolderModal()">
                            ❌ 關閉
                        </button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // 載入資料夾內容
            loadFolderContents(filePath);
            
            // 點擊背景關閉
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    closeFolderModal();
                }
            });
        }
        
        // 載入資料夾內容
        async function loadFolderContents(filePath) {
            try {
                const response = await fetch('/api/get_folder_contents', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        folder_path: filePath
                    })
                });
                
                const result = await response.json();
                const contentsDiv = document.getElementById('folder-contents');
                
                if (response.ok && result.success) {
                    displayFolderContents(result.contents);
                } else {
                    contentsDiv.innerHTML = `<div class="folder-error">❌ 無法載入資料夾內容: ${result.error || '未知錯誤'}</div>`;
                }
            } catch (error) {
                console.error('載入資料夾內容失敗:', error);
                const contentsDiv = document.getElementById('folder-contents');
                contentsDiv.innerHTML = `<div class="folder-error">❌ 載入失敗: ${error.message}</div>`;
            }
        }
        
        // 顯示資料夾內容
        function displayFolderContents(contents) {
            const contentsDiv = document.getElementById('folder-contents');
            
            if (!contents || contents.length === 0) {
                contentsDiv.innerHTML = '<div class="folder-loading">📁 資料夾為空</div>';
                return;
            }
            
            let html = '';
            contents.forEach((item, index) => {
                const icon = getFileIcon(item.name, item.is_dir);
                
                html += `
                    <div class="folder-item">
                        <div class="folder-item-icon">${icon}</div>
                        <div class="folder-item-name">${item.name}</div>
                        <button class="folder-item-open" onclick="openFile('${item.full_path.replace(/'/g, "\\'")}', event)">開啟</button>
                    </div>
                `;
            });
            
            contentsDiv.innerHTML = html;
        }
        
        // 開啟檔案 - 使用後端API
        async function openFile(filePath, event) {
            event.stopPropagation();
            console.log('[DEBUG] 嘗試開啟檔案:', filePath);
            
            const fileName = filePath.split('/').pop();
            
            try {
                const response = await fetch('/api/open_file', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        file_path: filePath
                    })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    console.log('[DEBUG] 檔案開啟成功');
                    showNotification(`✅ 已開啟 ${fileName}`, 'success');
                } else {
                    console.log('[DEBUG] 檔案開啟失敗:', result.error);
                    showNotification(`❌ 無法開啟檔案: ${result.error}`, 'error');
                    // 自動複製路徑到剪貼板
                    navigator.clipboard.writeText(filePath).then(() => {
                        showNotification('📋 檔案路徑已複製到剪貼板', 'info');
                    });
                }
            } catch (error) {
                console.error('[DEBUG] 請求失敗:', error);
                showNotification(`❌ 網路錯誤，無法開啟檔案`, 'error');
                // 自動複製路徑到剪貼板
                navigator.clipboard.writeText(filePath).then(() => {
                    showNotification('📋 檔案路徑已複製到剪貼板', 'info');
                });
            }
        }
        
        // 獲取檔案圖標
        function getFileIcon(fileName, isDir) {
            if (isDir) return '📁';
            
            const ext = fileName.toLowerCase().split('.').pop();
            switch (ext) {
                case 'mp4':
                case 'avi':
                case 'mkv':
                case 'mov':
                case 'wmv':
                    return '🎬';
                case 'jpg':
                case 'jpeg':
                case 'png':
                case 'gif':
                    return '🖼️';
                case 'nfo':
                    return '📄';
                case 'txt':
                    return '📝';
                case 'srt':
                case 'sub':
                    return '💬';
                default:
                    return '📄';
            }
        }
        
        // 格式化檔案大小
        function formatFileSize(bytes) {
            if (!bytes) return '';
            
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        // 關閉資料夾彈出視窗
        function closeFolderModal() {
            const modal = document.querySelector('.folder-modal');
            if (modal) {
                document.body.removeChild(modal);
            }
        }
        
        // 複製資料夾路徑
        function copyFolderPath(filePath) {
            navigator.clipboard.writeText(filePath).then(() => {
                showNotification('📋 資料夾路徑已複製到剪貼板', 'success');
                closeFolderModal();
            }).catch(() => {
                // 備用複製方法
                const textArea = document.createElement('textarea');
                textArea.value = filePath;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showNotification('📋 資料夾路徑已複製到剪貼板', 'success');
                closeFolderModal();
            });
        }

        // 刪除影片資料夾
        async function deleteVideo(avCode, filePath, event) {
            event.stopPropagation(); // 防止觸發卡片點擊
            
            // 顯示確認對話框
            const confirmed = confirm(`確定要刪除 ${avCode} 的整個資料夾嗎？\n\n這將會刪除：\n- 影片檔案\n- NFO檔案\n- 封面圖片\n- 整個 ${avCode} 資料夾\n\n此操作無法復原！`);
            
            if (!confirmed) {
                return;
            }
            
            try {
                const response = await fetch('/api/delete_video', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        av_code: avCode,
                        file_path: filePath
                    })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert(`✅ 成功刪除 ${avCode} 資料夾`);
                    
                    // 從資料中移除
                    allData = allData.filter(item => item.av_code !== avCode);
                    
                    // 從最愛中移除
                    if (favorites.has(avCode)) {
                        favorites.delete(avCode);
                        saveFavorites();
                    }
                    
                    // 重新渲染和更新篩選
                    applyFilters();
                    updateFilters();
                } else {
                    alert(`❌ 刪除失敗：${result.error}`);
                }
            } catch (error) {
                console.error('刪除錯誤:', error);
                alert(`❌ 刪除失敗：${error.message}`);
            }
        }


        // 分頁功能
        function initializePagination() {
            // 分頁按鈕事件
            setupPaginationButtons();
        }
        
        function setupPaginationButtons() {
            document.getElementById('first-btn').addEventListener('click', () => goToPage(1));
            document.getElementById('prev-btn').addEventListener('click', () => goToPage(currentPage - 1));
            document.getElementById('next-btn').addEventListener('click', () => goToPage(currentPage + 1));
            document.getElementById('last-btn').addEventListener('click', () => goToPage(totalPages));
        }
        
        function goToPage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            
            // 跳到其他頁面時自動回到最上面
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
            
            updatePagination();
            renderCurrentPage();
        }
        
        function updatePagination() {
            const totalItems = currentData.length;
            totalPages = Math.ceil(totalItems / pageSize);
            
            if (totalItems <= pageSize) {
                // 如果資料少於一頁，隱藏分頁控制
                document.getElementById('pagination').style.display = 'none';
                return;
            }
            
            // 顯示分頁控制
            document.getElementById('pagination').style.display = 'flex';
            
            
            // 更新按鈕狀態和頁碼
            updatePaginationButtons();
            updatePaginationNumbers();
        }
        
        function updatePaginationNumbers() {
            const numbersContainer = document.getElementById('pagination-numbers');
            numbersContainer.innerHTML = '';
            
            if (totalPages <= 7) {
                // 少於7頁，顯示所有頁碼
                for (let i = 1; i <= totalPages; i++) {
                    addPageNumber(i);
                }
            } else {
                // 固定顯示格式：第一頁 + 當前頁±2 + 最後一頁（不使用省略號）
                const start = Math.max(2, currentPage - 2);
                const end = Math.min(totalPages - 1, currentPage + 2);
                
                // 始終顯示第一頁
                addPageNumber(1);
                
                // 顯示當前頁±2的範圍（確保不重複顯示第一頁和最後一頁）
                for (let i = start; i <= end; i++) {
                    addPageNumber(i);
                }
                
                // 如果end不是最後一頁，添加省略號和最後一頁
                if (end < totalPages) {
                    if (end < totalPages - 1) {
                        addEllipsis();
                    }
                    addPageNumber(totalPages);
                }
            }
        }
        
        function addPageNumber(pageNum) {
            const numberSpan = document.createElement('span');
            numberSpan.className = `pagination-number ${pageNum === currentPage ? 'active' : ''}`;
            numberSpan.textContent = pageNum;
            if (pageNum !== currentPage) {
                numberSpan.addEventListener('click', () => goToPage(pageNum));
            }
            document.getElementById('pagination-numbers').appendChild(numberSpan);
        }
        
        function addEllipsis() {
            const ellipsis = document.createElement('span');
            ellipsis.className = 'pagination-ellipsis';
            ellipsis.textContent = '...';
            document.getElementById('pagination-numbers').appendChild(ellipsis);
        }
        
        // 改變每頁顯示數量
        function changePageSize(newSize) {
            const currentItem = (currentPage - 1) * pageSize + 1; // 記住當前第一個項目的位置
            pageSize = newSize;
            
            // 重新計算應該在哪一頁
            currentPage = Math.ceil(currentItem / pageSize);
            
            updatePagination();
            renderCurrentPage();
            
            console.log(`頁面大小已更改為 ${pageSize}，跳轉到第 ${currentPage} 頁`);
        }
        
        // 快速跳轉到指定頁面
        function jumpToPage() {
            const jumpInput = document.getElementById('jumpPage');
            const targetPage = parseInt(jumpInput.value);
            
            if (isNaN(targetPage) || targetPage < 1 || targetPage > totalPages) {
                jumpInput.value = currentPage; // 重置為當前頁
                showNotification('請輸入有效的頁碼！', 'error');
                return;
            }
            
            goToPage(targetPage);
            jumpInput.blur(); // 移除焦點
        }

        function updatePaginationButtons() {
            document.getElementById('first-btn').disabled = currentPage === 1;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage === totalPages;
            document.getElementById('last-btn').disabled = currentPage === totalPages;
        }
        
        // 清除分頁控制
        function clearPagination() {
            currentPage = 1;
            totalPages = 1;
            currentData = [];
            document.getElementById('pagination').style.display = 'none';
            const numbersContainer = document.getElementById('pagination-numbers');
            if (numbersContainer) {
                numbersContainer.innerHTML = '';
            }
        }
        
        // 清除進度顯示（重置為初始狀態）
        function clearProgressDisplay() {
            // 清除所有進度相關的顯示
            const progressFills = document.querySelectorAll('.progress-fill');
            const progressTexts = document.querySelectorAll('.progress-text');
            
            progressFills.forEach(fill => {
                fill.style.width = '0%';
            });
            
            progressTexts.forEach(text => {
                text.textContent = '';
            });
            
            // 重置狀態顯示為初始狀態
            statusText.textContent = '📁 選取資料夾以進行掃描';
            statusText.className = 'status-text';
            
            // 清除卡片欄，回到初始狀態
            clearAllData();
            showEmptyState();
        }
        
        // 清除所有資料和UI狀態
        function clearAllData() {
            // 清空所有資料
            allData = [];
            currentData = [];
            filteredData = [];
            
            // 重置分頁
            currentPage = 1;
            totalPages = 1;
            clearPagination();
            
            // 清除篩選器
            activeFilters = {
                search: '',
                actress: [],
                seriesGenre: [],
                favorites: false
            };
            
            // 清除圖片快取（可選，保留已載入的圖片以提升性能）
            // imageCache.clear();
            // loadedImages.clear();
            // pageImageCache.clear();
            
            // 重置篩選器UI
            updateFilters();
            
            // 清空畫廊
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
        }
        
        function renderCurrentPage() {
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = currentData.slice(start, end);
            
            // 渲染當前頁的卡片
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = pageData.map(item => createCardHTML(item)).join('');
        }

        // DOM 元素
        const browseBtn = document.getElementById('browseBtn');
        const scanBtn = document.getElementById('scanBtn');
        const loadBtn = document.getElementById('loadBtn');
        const stopBtn = document.getElementById('stopBtn');
        const folderInput = document.getElementById('folderInput');
        const directoryInput = document.getElementById('directoryInput');
        const searchInput = document.getElementById('searchInput');
        const gallery = document.getElementById('gallery');
        const emptyState = document.getElementById('emptyState');
        const statusText = document.getElementById('statusText');

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            setupSocketListeners();
            initializePagination();
            loadFavorites();
            // 注意：showEmptyState() 已在 resetPageToInitialState() 中調用
            // 頁面重置系統會自動處理初始狀態
        });

        function setupEventListeners() {
            // 選擇目錄
            browseBtn.addEventListener('click', function() {
                folderInput.click();
            });

            folderInput.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {

        function setupSocketListeners() {
            socket.on('connect', function() {
                console.log('Connected to server');
            });

            socket.on('crawl_progress', function(data) {
                console.log('📊 [PROGRESS] crawl_progress event received:', data);
                
                // 使用傳入的百分比或計算掃描進度百分比
                const percentage = data.percentage || (data.total > 0 ? Math.round((data.current / data.total) * 100) : 0);
                const successful = data.successful || 0;
                
                // 更新進度狀態 - 顯示成功處理數/總數和掃描進度百分比
                const fileName = data.file || '掃描中';
                const folderName = fileName.split('/').pop() || fileName;
                if (folderName && folderName !== '掃描中' && folderName !== '') {
                    statusText.textContent = `📂 ${folderName} - (${successful}/${data.total}) ${percentage}%`;
                } else {
                    statusText.textContent = `掃描中 - (${successful}/${data.total}) ${percentage}%`;
                }
                statusText.className = 'status-text scanning';
                
                console.log('📊 [PROGRESS] 狀態已更新:', percentage + '%');
            });

            socket.on('crawl_info', function(data) {
                console.log('📝 [INFO] crawl_info event received:', data.message, 'isScanning:', isScanning);
                
                // 檢查掃描是否已完成，如果完成則不更新進度文本
                if (!isScanning) {
                    console.log('⛔ [INFO] 掃描已完成，忽略 crawl_info 事件:', data.message);
                    return;
                }
                
                console.log('✅ [INFO] crawl_info 事件:', data.message);
                
                // 更新第二行狀態信息
                if (isScanning) {
                    const statusDiv = statusText.querySelector('div:last-child');
                    if (statusDiv) {
                        let icon = '📄';
                        let message = data.message;
                        
                        if (message.includes('下載封面')) icon = '🖼️';
                        else if (message.includes('生成NFO') || message.includes('寫入NFO')) icon = '📝';
                        else if (message.includes('已存在') || message.includes('跳過')) icon = '✅';
                        else if (message.includes('載入現有')) icon = '📁';
                        
                        statusDiv.innerHTML = `${icon} ${message.substring(0, 25)}${message.length > 25 ? '...' : ''}`;
                    }
                }
            });

            socket.on('crawl_success', function(data) {
                console.log('Crawl success:', data.message);
                allData.push(data.data);
                applyFilters();
                updateFilters();
            });

            socket.on('crawl_error', function(data) {
                console.error('Crawl error:', data.message);
            });

            socket.on('crawl_complete', function(data) {
                console.log('🎉 [COMPLETE] Crawl complete event received:', data.message, data);
                
                // 立即設置掃描狀態為false，防止後續crawl_info事件干擾
                isScanning = false;
                console.log('🔄 [COMPLETE] isScanning set to false');
                resetScanControls();
                
                // 使用傳入的統計數據或計算統計數據
                const successCount = data.processed || allData.length;
                const totalCount = data.total || data.total_found || successCount;
                
                console.log('掃描統計:', { successCount, totalCount });
                
                // 顯示掃描完成信息 - 使用新格式 (成功數/總數)
                statusText.textContent = `🎉 已完成，共處理 (${successCount}/${totalCount}) 部影片`;
                statusText.className = 'status-text complete';
                
                console.log('掃描完成信息已顯示');
                
                // 掃描完成後顯示內容
                if (allData.length > 0) {
                    hideEmptyState();
                } else {
                    showEmptyState();
                }
                
                // 移除自動重置，讓完成訊息保持顯示直到下次選擇路徑
            });

            socket.on('crawl_stopped', function(data) {
                console.log('Crawl stopped:', data.message);
                isScanning = false;
                resetScanControls();
                
                // 顯示停止信息
                statusText.textContent = '⏹️ 掃描已停止';
                statusText.className = 'status-text error';
                console.log('掃描停止信息已顯示');
            });
        }

        function applyFilters() {
            console.log('=== 開始篩選 ===');
            console.log('總影片數:', allData.length);
            console.log('當前篩選條件:', activeFilters);
            
            // 輸出幾個樣本資料的系列和類型資訊
            if (allData.length > 0) {
                console.log('樣本資料:', allData.slice(0, 3).map(item => ({
                    av_code: item.av_code,
                    系列: item['系列'],
                    類型: item['類型']
                })));
            }
            
            filteredData = allData.filter(item => {
                // 搜尋篩選
                if (activeFilters.search) {
                    const searchTerm = activeFilters.search.toLowerCase();
                    if (!(
                        (item.av_code && item.av_code.toLowerCase().includes(searchTerm)) ||
                        (item.title && item.title.toLowerCase().includes(searchTerm)) ||
                        (item['出演者'] && item['出演者'].toLowerCase().includes(searchTerm)) ||
                        (item['類型'] && item['類型'].toLowerCase().includes(searchTerm)) ||
                        (item['系列'] && item['系列'].toLowerCase().includes(searchTerm))
                    )) {
                        return false;
                    }
                }

                // 女優篩選 - 支援多選
                if (activeFilters.actress.length > 0) {
                    const actressValue = item['出演者'] || '';
                    // 將欄位字串拆解為陣列（處理逗號、斜線、空格）
                    const actresses = actressValue.split(/[,，]|\s*\/\s*|\s+/).map(a => a.trim()).filter(a => a);
                    
                    // 修改這裡：只使用精確匹配
                    const actressMatch = activeFilters.actress.some(selectedActress => 
                        actresses.includes(selectedActress)
                    );
                    
                    if (!actressMatch) return false;
                }

                // 系列/類型篩選 - 支援多選（簡化版本，參考女優邏輯）
                if (activeFilters.seriesGenre.length > 0) {
                    const seriesValue = item['系列'] || '';
                    const genreValue = item['類型'] || '';
                    
                    // 將系列和類型合併成一個字串進行搜尋，就像女優篩選一樣
                    const combinedValue = `${seriesValue} ${genreValue}`;
                    const seriesGenres = combinedValue.split(/[,，]|\s*\/\s*|\s+/).map(sg => sg.trim()).filter(sg => sg);
                    
                    console.log('=== 檢查影片 ===', item.av_code);
                    console.log('系列:', seriesValue);
                    console.log('類型:', genreValue);
                    console.log('合併後分割:', seriesGenres);
                    console.log('選中條件:', activeFilters.seriesGenre);
                    
                    // 檢查是否有任一選中的系列或類型匹配（修復版本）
                    const seriesGenreMatch = activeFilters.seriesGenre.some(selectedItem => {
                        console.log('檢查選中項目:', selectedItem);
                        
                        // 檢查系列是否匹配 - 雙向匹配
                        if (seriesValue && seriesValue !== 'N/A' && seriesValue.trim() !== '') {
                            const match1 = seriesValue.toLowerCase().includes(selectedItem.toLowerCase());
                            const match2 = selectedItem.toLowerCase().includes(seriesValue.toLowerCase());
                            console.log('系列匹配檢查:', seriesValue, '→', match1 || match2);
                            if (match1 || match2) {
                                return true;
                            }
                        }
                        
                        // 檢查類型是否匹配
                        if (genreValue && genreValue !== 'N/A' && genreValue.trim() !== '') {
                            const genres = genreValue.split(/[,，]|\s*\/\s*/).map(g => g.trim()).filter(g => g);
                            const genreMatch = genres.some(genre => {
                                const match1 = genre.toLowerCase().includes(selectedItem.toLowerCase());
                                const match2 = selectedItem.toLowerCase().includes(genre.toLowerCase());
                                return match1 || match2;
                            });
                            console.log('類型匹配檢查:', genreValue, '→', genreMatch);
                            if (genreMatch) {
                                return true;
                            }
                        }
                        
                        return false;
                    });
                    
                    console.log('匹配結果:', seriesGenreMatch);
                    if (!seriesGenreMatch) return false;
                }

                // 我的最愛篩選
                if (activeFilters.favorites) {
                    const isFavorited = favorites.has(item.av_code);
                    console.log('最愛篩選檢查:', item.av_code, '→', isFavorited);
                    if (!isFavorited) return false;
                }

                return true;
            });

            renderGallery();
        }

        function renderGallery() {
            if (filteredData.length === 0) {
                showEmptyState();
                // 隱藏分頁控制
                document.getElementById('pagination').style.display = 'none';
                return;
            }

            hideEmptyState();
            
            // 更新當前資料並重置分頁
            currentData = filteredData;
            currentPage = 1;
            
            // 更新分頁並渲染
            updatePagination();
            renderCurrentPage();
        }

        function createCardHTML(item) {
            // 處理封面路徑 - 只有確認有封面時才使用封面路徑
            let coverSrc = '/static/placeholder.jpg';
            let hasRealCover = false;
            
            if (item.has_cover && (item.cover_url || item.local_cover)) {
                if (item.cover_url && item.cover_url.startsWith('/covers/')) {
                    coverSrc = item.cover_url;
                    hasRealCover = true;
                } else if (item.local_cover && item.local_cover.startsWith('/covers/')) {
                    coverSrc = item.local_cover;
                    hasRealCover = true;
                }
            }

            return `
                <div class="card" onclick="playVideo('${item.file_path || ''}', '${item.av_code}')">
                    <div class="card-image">
                        <img src="${coverSrc}" 
                             alt="${item.title || item.av_code}" 
                             onerror="this.style.display='none'; this.parentElement.style.background='#333';"
                             onload="this.style.display='block';">
                        <div class="card-overlay">
                            <div class="play-button">
                                <i class="fas fa-play"></i>
                            </div>
                        </div>
                    </div>
                    <div class="card-content">
                        <div class="card-code">
                            ${item.av_code || 'N/A'}
                            <div style="display: flex; align-items: center;">
                                <i class="fas fa-folder folder-icon"
                                   onclick="openFolder('${item.file_path}', event)"
                                   title="打開影片資料夾"></i>
                                <i class="fas fa-trash delete-icon" 
                                   onclick="deleteVideo('${item.av_code}', '${item.file_path}', event)" 
                                   title="刪除影片資料夾"></i>
                                <i class="heart-icon ${favorites.has(item.av_code) ? 'fas fa-heart favorited' : 'far fa-heart'}" 
                                   onclick="toggleFavorite('${item.av_code}', event)"
                                   title="加入最愛"></i>
                            </div>
                        </div>
                        <div class="card-title">${item.title || ''}</div>
                        <div class="card-detail">👤 ${item['出演者'] || ''}</div>
                        <div class="card-detail">📺 ${item['系列'] || ''}</div>
                        <div class="card-detail">🏷️ ${item['類型'] || ''}</div>
                        <div class="card-description">${item['簡介'] || ''}</div>
                        <div class="card-info">
                            <span>${item['片長'] || ''}</span>
                            <span>${item['發行日期'] || ''}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateFilters() {
            updateActressFilters();
            updateSeriesGenreFilters();
        }

        function updateActressFilters() {
            const actresses = new Set();
            allData.forEach(item => {
                const actressValue = item['出演者'] || '';
                if (actressValue && actressValue !== '不明') {
                    actressValue.split(/[,，]|\s*\/\s*/).forEach(actress => {
                        const trimmed = actress.trim();
                        if (trimmed) actresses.add(trimmed);
                    });
                }
            });

            // 更新標籤數量顯示
            const actressLabel = document.getElementById('actressLabel');
            // 更新女優數量，保留清除按鈕
            const actressButton = actressLabel.querySelector('#clearActressBtn');
            actressLabel.innerHTML = `👤 女優（${actresses.size}）`;
            if (actressButton) {
                actressLabel.appendChild(actressButton);
            }

            const container = document.getElementById('actressFilters');
            container.innerHTML = Array.from(actresses)
                .map(actress => `
                    <span class="filter-tag ${activeFilters.actress.includes(actress) ? 'active' : ''}" 
                          onclick="toggleFilter('actress', '${actress.replace(/'/g, '\\\'')}')">${actress}</span>
                `).join('');
        }

        function updateSeriesGenreFilters() {
            const items = new Set();
            const seriesCount = new Set();
            const genreCount = new Set();
            
            allData.forEach(item => {
                // 添加系列
                const seriesValue = item['系列'] || '';
                if (seriesValue && seriesValue !== 'N/A') {
                    items.add('📺 ' + seriesValue);
                    seriesCount.add(seriesValue);
                }
                
                // 添加類型
                const genreValue = item['類型'] || '';
                if (genreValue && genreValue !== 'N/A') {
                    genreValue.split(/[,，]|\s*\/\s*/).forEach(genre => {
                        const trimmed = genre.trim();
                        if (trimmed) {
                            items.add('🏷️ ' + trimmed);
                            genreCount.add(trimmed);
                        }
                    });
                }
            });

            // 更新標籤數量顯示
            const seriesGenreLabel = document.getElementById('seriesGenreLabel');
            // 更新系列/類型數量，保留清除按鈕
            const seriesGenreButton = seriesGenreLabel.querySelector('#clearSeriesGenreBtn');
            seriesGenreLabel.innerHTML = `📺 系列（${seriesCount.size}） ｜ 🏷️ 類型（${genreCount.size}）`;
            if (seriesGenreButton) {
                seriesGenreLabel.appendChild(seriesGenreButton);
            }

            const container = document.getElementById('seriesGenreFilters');
            container.innerHTML = Array.from(items)
                .map(item => {
                    const value = item.substring(2); // 移除emoji前綴
                    return `
                        <span class="filter-tag ${activeFilters.seriesGenre.includes(value) ? 'active' : ''}" 
                              onclick="toggleFilter('seriesGenre', '${value.replace(/'/g, '\\\'')}')">${item}</span>
                    `;
                }).join('');
        }

        function toggleFilter(type, value) {
            console.log('toggleFilter called:', type, value);
            
            if (type === 'search') {
                activeFilters[type] = value;
            } else {
                // actress 和 seriesGenre 使用陣列多選
                const currentFilters = activeFilters[type];
                const index = currentFilters.indexOf(value);
                
                if (index > -1) {
                    // 已選中，移除
                    currentFilters.splice(index, 1);
                    console.log('移除篩選:', value, '剩餘:', currentFilters);
                } else {
                    // 未選中，添加
                    currentFilters.push(value);
                    console.log('添加篩選:', value, '現有:', currentFilters);
                }
            }
            
            console.log('當前篩選狀態:', activeFilters);
            applyFilters();
            updateFilters();
        }

        function playVideo(filePath, avCode) {
            if (!filePath) {
                alert('找不到影片檔案路徑');
                return;
            }
            
            // 使用 Flask 路由來提供影片檔案
            const videoUrl = `/video/${encodeURIComponent(avCode)}`;
            
            const videoContainer = document.createElement('div');
            videoContainer.className = 'video-player-overlay';
            videoContainer.innerHTML = `
                <div class="video-player-container">
                    <div class="video-header">
                        <span>${avCode}</span>
                        <button onclick="closeVideo()" class="close-btn">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <video controls autoplay preload="metadata">
                    <source src="${videoUrl}" type="video/mp4">
                    <p>您的瀏覽器不支援 video 元素或無法載入影片。</p>
                </video>
                </div>
            `;
            
            document.body.appendChild(videoContainer);
            
            // 獲取影片元素並設定鍵盤控制
            const video = videoContainer.querySelector('video');
            
            // 移除焦點邊框
            video.style.outline = 'none';
            video.style.border = 'none';
            
            // 等待影片載入後自動焦點並啟用鍵盤控制
            video.addEventListener('loadedmetadata', function() {
                // 自動焦點到影片
                video.focus();
                
                // 添加鍵盤事件監聽
                function handleKeydown(e) {
                    switch(e.key) {
                        case 'ArrowLeft':
                            e.preventDefault();
                            video.currentTime = Math.max(0, video.currentTime - 10);
                            break;
                        case 'ArrowRight':
                            e.preventDefault();
                            video.currentTime = Math.min(video.duration, video.currentTime + 10);
                            break;
                        case ' ':
                        case 'Spacebar':
                            e.preventDefault();
                            if (video.paused) {
                                video.play();
                            } else {
                                video.pause();
                            }
                            break;
                        case 'Escape':
                            closeVideo();
                            break;
                    }
                }
                
                video.addEventListener('keydown', handleKeydown);
                
                // 確保點擊影片時重新獲得焦點
                video.addEventListener('click', function() {
                    video.focus();
                });
            });
        }

        function closeVideo() {
            const overlay = document.querySelector('.video-player-overlay');
            if (overlay) {
                overlay.remove();
            }
        }

        function showEmptyState() {
            gallery.style.display = 'none';
            emptyState.style.display = 'block';
        }

        function hideEmptyState() {
            gallery.style.display = 'grid';
            emptyState.style.display = 'none';
        }

        function hideContent() {
            gallery.style.display = 'none';
            emptyState.style.display = 'none';
        }

        // 鍵盤快捷鍵
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeVideo();
            }
        });
    </script>
</body>
